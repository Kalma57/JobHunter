<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JobHunter Board</title>
<meta name="description" content="סוכן חיפוש עבודה אישי: כל בוקר קורא עשרות אתרי קריירה, מסנן, ו-Claude בונה כרטיס לכל משרה.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@700;900&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&display=swap">
<style>
/* Layout: a triage desk. Who + this morning's numbers on top; the job list beside the open job's full card.
   Everyone reads; only the owner (with a GitHub key in this browser) sees the buttons. */
:root {
  --bg: #eceff2; --surface: #ffffff; --sunken: #f5f7f9; --fg: #17212b; --muted: #5b6876; --line: #d5dce3;
  --accent: #0f6b74; --accent-soft: #dcefef; --ok: #1c7347; --ok-soft: #dff1e6; --warn: #8a5300; --warn-soft: #fbedd5;
  --bad: #a1302a; --bad-soft: #f7e1df; --inferred: #6a3d9e; --inferred-soft: #eee6f8;
  --font-display: "Frank Ruhl Libre", Georgia, serif;
  --font-body: "IBM Plex Sans Hebrew", "Segoe UI", Arial, sans-serif;
  --font-data: "IBM Plex Mono", Consolas, "Courier New", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1519; --surface: #172026; --sunken: #121a1f; --fg: #e3eaef; --muted: #93a3ae; --line: #2a3640;
    --accent: #5cc2c9; --accent-soft: #15333a; --ok: #6fcf98; --ok-soft: #173326; --warn: #e9b35d; --warn-soft: #3a2b12;
    --bad: #f08a82; --bad-soft: #3d1d1b; --inferred: #c4a3ef; --inferred-soft: #2c2140; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1519; --surface: #172026; --sunken: #121a1f; --fg: #e3eaef; --muted: #93a3ae; --line: #2a3640;
  --accent: #5cc2c9; --accent-soft: #15333a; --ok: #6fcf98; --ok-soft: #173326; --warn: #e9b35d; --warn-soft: #3a2b12;
  --bad: #f08a82; --bad-soft: #3d1d1b; --inferred: #c4a3ef; --inferred-soft: #2c2140; color-scheme: dark;
}
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 1320px; margin: 0 auto; padding-inline: 16px; padding-block: 0 40px; }
button, input, textarea, select { font: inherit; color: inherit; }
:is(button, input, textarea, select, a):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }

/* header */
.intro { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px 24px; padding-block: 22px 10px; }
.brand { margin: 0; font-family: var(--font-display); font-weight: 900; font-size: 32px; letter-spacing: -0.01em; line-height: 1.1; }
.brand span { color: var(--accent); }
.who { display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: 14px; color: var(--muted); margin-top: 4px; }
.who b { color: var(--fg); font-weight: 600; }
.owner { display: flex; gap: 8px; align-items: center; font-size: 13px; }
.owner .state { color: var(--ok); font-weight: 600; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 10px; border-bottom: 1px solid var(--line); border-top: 1px solid var(--line); }
.strip { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 13px; color: var(--muted); align-items: baseline; }
.strip b { font-family: var(--font-data); font-weight: 500; color: var(--fg); font-variant-numeric: tabular-nums; }
.strip .when { color: var(--fg); font-weight: 600; }
.strip .bad { color: var(--bad); font-weight: 600; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }

/* owner key panel */
.keybox { margin-top: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; max-width: 720px; }
.keybox p { margin: 0; font-size: 14px; color: var(--muted); }
.keybox .row2 { display: flex; gap: 8px; flex-wrap: wrap; }
.keybox input { flex: 1 1 280px; min-width: 0; border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; background: var(--sunken); font-family: var(--font-data); font-size: 13px; }
.keybox .err { color: var(--bad); font-size: 13.5px; }

/* desk */
.desk { display: grid; grid-template-columns: minmax(340px, 440px) minmax(0, 1fr); gap: 20px; margin-top: 16px; align-items: start; }
.side { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; }
.tab { border: 1px solid transparent; background: none; border-radius: 6px; padding: 4px 10px; cursor: pointer; display: inline-flex; gap: 6px; align-items: baseline; font-size: 14px; color: var(--muted); }
.tab .n { font-family: var(--font-data); font-size: 12px; }
.tab:hover { color: var(--fg); }
.tab[aria-selected="true"] { background: var(--surface); border-color: var(--line); color: var(--fg); font-weight: 600; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; }
.filters input, .filters select { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 6px 10px; font-size: 14px; min-width: 0; }
.filters input { flex: 1 1 180px; }
.rows { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.row { display: grid; grid-template-columns: 4px minmax(0, 1fr) auto; gap: 0 12px; align-items: center; text-align: start; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 10px 12px 10px 14px; cursor: pointer; width: 100%; }
.row:last-child { border-bottom: 0; }
.row:hover { background: var(--sunken); }
.row[aria-current="true"] { background: var(--accent-soft); }
.row .stripe { align-self: stretch; border-radius: 2px; background: var(--line); }
.row .stripe.high { background: var(--ok); } .row .stripe.mid { background: var(--accent); } .row .stripe.low { background: var(--warn); }
.row .t { font-weight: 600; font-size: 14.5px; line-height: 1.35; overflow-wrap: anywhere; }
.row .s { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.row .meta { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
.row .d { font-family: var(--font-data); font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.count-line { font-size: 12.5px; color: var(--muted); }

/* card */
.main { min-width: 0; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 56px); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px 22px; display: flex; flex-direction: column; gap: 14px; max-height: calc(100vh - 90px); overflow-y: auto; }
.back { display: none; }
.card h2 { margin: 0; font-size: 21px; line-height: 1.3; text-wrap: balance; overflow-wrap: anywhere; }
.sub { color: var(--muted); font-size: 14.5px; overflow-wrap: anywhere; }
.pills { display: flex; gap: 6px; flex-wrap: wrap; }
.pill { font-size: 12px; font-weight: 600; border-radius: 999px; padding: 2px 9px; white-space: nowrap; }
.t-accent { background: var(--accent-soft); color: var(--accent); } .t-ok { background: var(--ok-soft); color: var(--ok); }
.t-warn { background: var(--warn-soft); color: var(--warn); } .t-bad { background: var(--bad-soft); color: var(--bad); }
.t-muted { background: var(--sunken); color: var(--muted); }
.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px 18px; margin: 0; }
.facts div { min-width: 0; }
.facts dt { font-size: 11.5px; font-weight: 600; color: var(--muted); letter-spacing: 0.03em; }
.facts dd { margin: 0; font-size: 14px; overflow-wrap: anywhere; }
.ns { color: var(--muted); font-style: italic; }
.inf { color: var(--inferred); background: var(--inferred-soft); border-radius: 4px; padding: 0 4px; }
.inf::after { content: " · הוסק"; font-size: 11px; }
.reason { margin: 0; font-size: 14.5px; padding: 8px 12px; border-radius: 8px; background: var(--sunken); }
.reason b { font-weight: 600; }
.prefs { display: flex; flex-wrap: wrap; gap: 6px; }
.pref { font-family: var(--font-data); font-size: 12px; border-radius: 4px; padding: 1px 7px; }
.pref.up { background: var(--ok-soft); color: var(--ok); } .pref.down { background: var(--bad-soft); color: var(--bad); }
.alerts { display: flex; flex-direction: column; gap: 4px; }
.alert { font-size: 13.5px; border-radius: 6px; padding: 4px 10px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding-block: 4px; }
.btn { font-size: 14px; border-radius: 6px; padding: 6px 13px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.apply { background: var(--ok); border-color: var(--ok); color: var(--surface); text-decoration: none; font-weight: 600; }
.btn:disabled { opacity: 0.5; cursor: default; }
.ext { font-size: 14px; color: var(--accent); margin-inline-start: auto; }
.inline-form { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--accent-soft); border-radius: 8px; padding: 8px 10px; }
.inline-form label { font-size: 13px; color: var(--muted); }
.inline-form input { font-size: 14px; border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; background: var(--surface); min-width: 0; }
.inline-form input[type="text"] { flex: 1 1 200px; }
.section h3 { margin: 0 0 6px; font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: 0.04em; }
.section ul { margin: 0; padding-inline-start: 18px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 22px; }
.two > div { min-width: 0; }
.desc { white-space: pre-line; font-size: 14.5px; max-width: 72ch; }
.notes { width: 100%; min-height: 64px; resize: vertical; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; background: var(--sunken); font-size: 14px; }
.notes-ro { white-space: pre-line; font-size: 14px; background: var(--sunken); border-radius: 6px; padding: 8px 10px; }
.applyurl { width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; background: var(--sunken); font-size: 14px; }
.hist { font-family: var(--font-data); font-size: 12px; color: var(--muted); }
.src { font-size: 13px; color: var(--muted); }

/* report + about */
.report table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.report th { text-align: start; font-size: 11.5px; color: var(--muted); font-weight: 600; letter-spacing: 0.03em; padding: 6px 8px; border-bottom: 1px solid var(--line); }
.report td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; overflow-wrap: anywhere; }
.report td a { color: var(--fg); text-decoration: none; }
.report td a:hover { color: var(--accent); text-decoration: underline; }
.tablebox { overflow-x: auto; }
.funnel { display: flex; flex-direction: column; border-top: 2px solid var(--fg); }
.stage { display: grid; grid-template-columns: minmax(80px, 120px) minmax(0, 1fr); gap: 4px 16px; align-items: center; padding-block: 9px; border-bottom: 1px solid var(--line); }
.stage .n { font-family: var(--font-data); font-size: 24px; font-variant-numeric: tabular-nums; line-height: 1; }
.stage .label small { color: var(--muted); font-size: 13px; margin-inline-start: 6px; }
.bar { height: 7px; background: var(--accent-soft); border-radius: 2px; overflow: hidden; margin-top: 5px; }
.bar i { display: block; height: 100%; background: var(--accent); min-width: 2px; }
.errs { margin: 0; padding-inline-start: 18px; color: var(--bad); font-size: 13.5px; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px; counter-reset: s; }
.steps li { counter-increment: s; border-top: 2px solid var(--fg); padding-top: 8px; min-width: 0; }
.steps li::before { content: counter(s); font-family: var(--font-data); font-size: 13px; color: var(--accent); display: block; margin-bottom: 2px; }
.steps b { display: block; margin-bottom: 2px; }
.steps p { margin: 0; color: var(--muted); font-size: 14px; }

.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; padding: 28px 20px; text-align: center; color: var(--muted); }
.empty strong { display: block; color: var(--fg); font-size: 16px; margin-bottom: 4px; }
.toast { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 16px; border-radius: 8px; font-size: 14px; z-index: 10; }
@media (max-width: 900px) {
  .desk { grid-template-columns: 1fr; }
  .main { position: static; }
  .card { max-height: none; }
  .desk.reading .side { display: none; }
  .desk:not(.reading) .main { display: none; }
  .back { display: inline-flex; align-self: flex-start; }
  .two { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: no-preference) { .row { transition: background-color .12s; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="intro">
    <div>
      <h1 class="brand">Job<span>Hunter</span></h1>
      <div class="who" id="who"></div>
    </div>
    <div class="owner" id="owner"></div>
  </header>
  <div class="top"><div class="strip" id="strip"></div></div>
  <div id="keybox"></div>
  <div class="desk" id="desk">
    <section class="side" aria-label="רשימת משרות">
      <div class="tabs" id="tabs" role="tablist"></div>
      <div class="filters" id="filters">
        <input id="search" type="search" placeholder="חיפוש: תפקיד, חברה, עיר, הערה" aria-label="חיפוש">
        <select id="f-rank" aria-label="התאמה">
          <option value="">כל ההתאמות</option><option value="high">גבוהה</option><option value="mid">בינונית</option><option value="low">נמוכה</option>
        </select>
        <select id="f-kind" aria-label="מקור">
          <option value="">כל המקורות</option><option value="company">אתרי חברות</option><option value="board">אתרי משרות</option>
        </select>
      </div>
      <div class="count-line" id="count"></div>
      <div id="list"></div>
    </section>
    <section class="main" id="main" aria-live="polite"></section>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<script id="data" type="application/json">/*__DATA__*/null</script>
<script>
const REPO = "Kalma57/JobHunter", BRANCH = "board-data", FILE = "statuses.json";
const DATA = JSON.parse(document.getElementById("data").textContent || "null") || { config: {}, run: {}, jobs: [], marks: {} };
const STATUS = {
  new: { label: "חדש", tone: "accent" }, hold: { label: "בהמתנה", tone: "warn" }, applied: { label: "הוגש", tone: "ok" },
  interview: { label: "ראיון", tone: "ok" }, offer: { label: "הצעה", tone: "ok" }, rejected: { label: "דחייה", tone: "bad" },
  not_interested: { label: "לא מעוניין", tone: "muted" }, closed: { label: "נסגרה", tone: "muted" }, filtered: { label: "סוננה", tone: "muted" },
};
const TABS = [
  { id: "new", label: "חדש", statuses: ["new"] },
  { id: "hold", label: "בהמתנה", statuses: ["hold"] },
  { id: "applied", label: "הגשתי", statuses: ["applied", "interview", "offer", "rejected"] },
  { id: "not_interested", label: "לא מעוניין", statuses: ["not_interested"] },
  { id: "filtered", label: "סוננו", statuses: ["filtered"] },
  { id: "closed", label: "נסגרו", statuses: ["closed"] },
  { id: "run", label: "דוח הבוקר", statuses: [] },
  { id: "about", label: "על המערכת", statuses: [] },
];
const EMPTY_TEXT = {
  new: "אין משרות חדשות כרגע. ריצת הבוקר מוסיפה לכאן משרות שעברו את כל דרישות החובה.",
  hold: "אין משרות בהמתנה.", applied: "עוד אין משרות שהוגשו.", not_interested: "אין משרות שסומנו \"לא מעוניין\".",
  filtered: "המוח לא סינן משרות.", closed: "אין משרות שנסגרו.",
};
const RANK = { high: { label: "התאמה גבוהה", tone: "ok" }, mid: { label: "התאמה בינונית", tone: "accent" }, low: { label: "התאמה נמוכה", tone: "warn" } };
const FIELD_LABELS = { location: "מיקום", work_mode: "אופן עבודה", level: "רמה", scope: "היקף", employment: "סוג העסקה", salary: "שכר", experience: "ניסיון", education: "השכלה", degree_time: "זמן לסיום תואר", company: "חברה" };
const BOARD_SOURCES = ["hiremetech:", "drushim:", "jobmaster:"];
const SOURCE_NAMES = { hiremetech: "HireMeTech", drushim: "דרושים", jobmaster: "JobMaster" };
const USER_FIELDS = ["notes", "applied_at", "apply_channel", "applied_description", "not_interested_reason", "apply_url"];

const state = { marks: DATA.marks || {}, sha: null, token: null, tab: "new", query: "", rank: "", kind: "", sel: null, form: null, draft: {}, busy: new Set(), keyOpen: false, keyError: "" };
const el = (id) => document.getElementById(id);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nf = new Intl.NumberFormat("he-IL");
const isBoard = (job) => BOARD_SOURCES.some((p) => String(job.source || "").startsWith(p));
const isOwner = () => !!state.token;
function fmtDate(iso, short) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return esc(iso);
  return d.toLocaleDateString("he-IL", short ? { day: "2-digit", month: "2-digit" } : { day: "2-digit", month: "2-digit", year: "numeric" });
}
const todayISO = () => new Date().toISOString().slice(0, 10);
const daysUntil = (iso) => Math.ceil((new Date(iso + "T23:59:59") - new Date()) / 86400000);
function sourceLabel(src) { const [sys, slug] = String(src || "").split(":"); return SOURCE_NAMES[sys] || (slug ? `אתר החברה (${sys})` : sys); }

// Same rule as jobhunter/overlay.py: the owner's mark counts unless the card has a newer event (a "closed" from the morning run).
function mergeMark(job, mark) {
  if (!mark) return job;
  const cardHist = job.history || [];
  const seen = new Set(cardHist.map((h) => `${h.at}|${h.status}`));
  const history = [...cardHist, ...(mark.history || []).filter((h) => !seen.has(`${h.at}|${h.status}`))];
  const last = (arr) => arr.reduce((m, h) => ((h.at || "") > m ? h.at || "" : m), "");
  const out = { ...job, history };
  for (const k of USER_FIELDS) if (k in mark) out[k] = mark[k];
  if (mark.status && last(mark.history || []) >= last(cardHist)) out.status = mark.status;
  return out;
}
const jobs = () => DATA.jobs.map((j) => mergeMark(j, state.marks[j.id]));

// ---- GitHub store: statuses.json on the board-data branch ----
const utf8ToB64 = (s) => { const b = new TextEncoder().encode(s); let bin = ""; for (let i = 0; i < b.length; i += 0x8000) bin += String.fromCharCode(...b.subarray(i, i + 0x8000)); return btoa(bin); };
const b64ToUtf8 = (s) => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g, "")), (c) => c.charCodeAt(0)));
function api(path, opts = {}) {
  return fetch(`https://api.github.com/repos/${REPO}${path}`, { ...opts, headers: { Accept: "application/vnd.github+json", ...(state.token ? { Authorization: `Bearer ${state.token}` } : {}), ...(opts.headers || {}) } });
}
async function fetchMarks() {
  if (state.token) {
    const r = await api(`/contents/${FILE}?ref=${BRANCH}&t=${Date.now()}`);
    if (!r.ok) throw new Error(`GitHub ${r.status}`);
    const j = await r.json();
    state.sha = j.sha;
    return JSON.parse(b64ToUtf8(j.content) || "{}");
  }
  const r = await fetch(`https://raw.githubusercontent.com/${REPO}/${BRANCH}/${FILE}?t=${Date.now()}`);
  return r.ok ? r.json() : state.marks;
}
async function saveMark(id, patch, event) {
  for (let attempt = 0; attempt < 2; attempt++) {
    const latest = await fetchMarks();
    const cur = latest[id] || {};
    latest[id] = { ...cur, ...patch, ...(event ? { history: [...(cur.history || []), event] } : {}) };
    if (event) latest[id].status = event.status;
    const r = await api(`/contents/${FILE}`, { method: "PUT", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: `Board: ${id}${event ? " -> " + event.status : ""}`, branch: BRANCH, sha: state.sha,
        content: utf8ToB64(JSON.stringify(latest, null, 1)) }) });
    if (r.ok) { state.sha = (await r.json()).content.sha; state.marks = latest; return; }
    if (r.status !== 409 && r.status !== 422) throw new Error(`GitHub ${r.status}`);
  }
  throw new Error("conflict");
}
async function checkKey(token) {
  const r = await fetch(`https://api.github.com/repos/${REPO}`, { headers: { Accept: "application/vnd.github+json", Authorization: `Bearer ${token}` } });
  if (!r.ok) return "המפתח לא עובד (GitHub ענה " + r.status + "). בדוק שהעתקת אותו במלואו.";
  const j = await r.json();
  if (!(j.permissions && j.permissions.push)) return "למפתח אין הרשאת כתיבה לריפו. צריך Contents: Read and write, והריפו " + REPO + " ברשימה.";
  const me = await fetch("https://api.github.com/user", { headers: { Accept: "application/vnd.github+json", Authorization: `Bearer ${token}` } });
  const login = me.ok ? (await me.json()).login : "";
  return login.toLowerCase() === REPO.split("/")[0].toLowerCase() ? "" : "המפתח שייך לחשבון " + login + " ולא לבעלי הלוח.";
}

  e.preventDefault();
  if (e.target.id === "keyform") {
    const token = el("keyinput").value.trim();
    if (!token) return;
    state.keyError = await checkKey(token);
    if (state.keyError) { render(); return; }
    state.token = token; state.keyOpen = false;
    try { localStorage.setItem("jh-gh-token", token); } catch {}
    try { state.marks = await fetchMarks(); } catch {}
    render(); toast("מצב עריכה פעיל בדפדפן הזה");
    return;
  }
  const form = e.target.closest("form[data-form]");
  const job = form && jobs().find((j) => j.id === form.dataset.id);
  if (!job) return;
  const data = new FormData(form);
  const note = String(data.get("note") || "").trim();
  state.form = null; state.draft = {};
  if (form.dataset.form === "apply") changeStatus(job, "applied", { applied_at: String(data.get("date") || todayISO()), apply_channel: note }, note);
  else changeStatus(job, "not_interested", { not_interested_reason: note }, note);
});
document.addEventListener("change", (e) => {
  if (e.target.id === "f-rank") { state.rank = e.target.value; render(); return; }
  if (e.target.id === "f-kind") { state.kind = e.target.value; render(); return; }
  if (!isOwner()) return;
  const applyId = e.target.dataset && e.target.dataset.apply;
  if (applyId) {
    const value = e.target.value.trim();
    if (value && !/^https?:\/\//.test(value)) { toast("הקישור צריך להתחיל ב-https://"); return; }
    saveField(applyId, { apply_url: value }, "קישור ההגשה נשמר");
    return;
  }
  const id = e.target.dataset && e.target.dataset.notes;
  if (id) saveField(id, { notes: e.target.value }, "ההערה נשמרה");
});

try { state.token = localStorage.getItem("jh-gh-token"); } catch {}
try { const saved = localStorage.getItem("jh-tab"); if (saved && TABS.some((t) => t.id === saved)) state.tab = saved; } catch {}
render();
fetchMarks().then((m) => { state.marks = m; render(); }).catch(() => {});
</script>
</body>
</html>
