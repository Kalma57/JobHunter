<title>JobHunter Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&display=swap">
<style>
/* Layout: one reading column; sticky header with run summary and status tabs; one card per job, details folded. */
:root {
  --bg: #eef2f5;
  --surface: #ffffff;
  --fg: #16202a;
  --muted: #5a6875;
  --line: #d6dee5;
  --accent: #1d5ca8;
  --accent-soft: #e2ecf8;
  --ok: #1c7347;
  --ok-soft: #dff1e6;
  --warn: #8f5500;
  --warn-soft: #fbedd5;
  --bad: #a1302a;
  --bad-soft: #f7e1df;
  --inferred: #6a3d9e;
  --inferred-soft: #eee6f8;
  --font-body: "IBM Plex Sans Hebrew", "Segoe UI", Arial, sans-serif;
  --font-data: "IBM Plex Mono", Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10161c; --surface: #18212a; --fg: #e4ebf1; --muted: #93a3b1; --line: #2b3742;
    --accent: #7fb0ec; --accent-soft: #1b2e45;
    --ok: #6fcf98; --ok-soft: #173326; --warn: #e9b35d; --warn-soft: #3a2b12;
    --bad: #f08a82; --bad-soft: #3d1d1b; --inferred: #c4a3ef; --inferred-soft: #2c2140;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10161c; --surface: #18212a; --fg: #e4ebf1; --muted: #93a3b1; --line: #2b3742;
  --accent: #7fb0ec; --accent-soft: #1b2e45;
  --ok: #6fcf98; --ok-soft: #173326; --warn: #e9b35d; --warn-soft: #3a2b12;
  --bad: #f08a82; --bad-soft: #3d1d1b; --inferred: #c4a3ef; --inferred-soft: #2c2140;
  color-scheme: dark;
}

body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.55; direction: rtl; }
.wrap { max-width: 880px; margin: 0 auto; padding-inline: 16px; padding-block: 0 48px; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 16px 10px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
.brand h1 span { color: var(--accent); }
.run { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.run b { color: var(--fg); font-weight: 600; }

.controls { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { font: inherit; font-size: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 5px 12px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.tab .n { font-family: var(--font-data); font-size: 12px; color: var(--muted); }
.tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.tab[aria-selected="true"] .n { color: var(--surface); }
.tab:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.search { font: inherit; width: 100%; box-sizing: border-box; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 8px; padding: 8px 12px; }

.list { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; }
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; padding: 28px 20px; text-align: center; color: var(--muted); }
.empty strong { display: block; color: var(--fg); font-size: 16px; margin-bottom: 4px; }

.job { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.job-head { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; }
.job-head > div { min-width: 0; }
.job-title { margin: 0; font-size: 17px; font-weight: 600; text-wrap: balance; overflow-wrap: anywhere; }
.job-sub { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
.pills { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; flex-shrink: 0; }
.pill { font-size: 12px; font-weight: 600; border-radius: 999px; padding: 2px 9px; white-space: nowrap; }
.t-accent { background: var(--accent-soft); color: var(--accent); }
.t-ok { background: var(--ok-soft); color: var(--ok); }
.t-warn { background: var(--warn-soft); color: var(--warn); }
.t-bad { background: var(--bad-soft); color: var(--bad); }
.t-muted { background: var(--bg); color: var(--muted); }

.facts { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 14px; }
.fact { display: inline-flex; gap: 4px; }
.fact .k { color: var(--muted); }
.ns { color: var(--muted); font-style: italic; }
.inf { color: var(--inferred); background: var(--inferred-soft); border-radius: 4px; padding: 0 4px; }
.inf::after { content: " · הוסק"; font-size: 11px; }

.prefs { display: flex; flex-wrap: wrap; gap: 6px; }
.pref { font-family: var(--font-data); font-size: 12px; border-radius: 4px; padding: 1px 7px; }
.pref.up { background: var(--ok-soft); color: var(--ok); }
.pref.down { background: var(--bad-soft); color: var(--bad); }

.alerts { display: flex; flex-direction: column; gap: 4px; }
.alert { font-size: 13px; border-radius: 6px; padding: 4px 10px; }
.reason { margin: 0; font-size: 14px; color: var(--muted); }
.reason b { color: var(--fg); font-weight: 600; }

details { border-top: 1px solid var(--line); padding-top: 8px; }
summary { cursor: pointer; font-size: 14px; color: var(--accent); }
.detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 20px; margin-top: 10px; font-size: 14px; }
.detail-grid > div { min-width: 0; }
.detail-grid h4 { margin: 0 0 4px; font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: 0.02em; }
.detail-grid ul { margin: 0; padding-inline-start: 18px; }
.detail-grid .wide { grid-column: 1 / -1; }
.hist { font-family: var(--font-data); font-size: 12px; color: var(--muted); }
@media (max-width: 560px) { .detail-grid { grid-template-columns: 1fr; } .job-head { flex-direction: column; } .pills { justify-content: flex-start; } }

.notes { font: inherit; font-size: 14px; width: 100%; box-sizing: border-box; min-height: 38px; resize: vertical; border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; background: var(--bg); color: var(--fg); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { font: inherit; font-size: 14px; border-radius: 6px; padding: 5px 12px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--fg); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.apply { background: var(--ok); border-color: var(--ok); color: var(--surface); text-decoration: none; font-weight: 600; }
.btn:disabled { opacity: 0.5; cursor: default; }
.link { font-size: 14px; color: var(--accent); margin-inline-start: auto; }
.inline-form { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--accent-soft); border-radius: 8px; padding: 8px 10px; }
.inline-form label { font-size: 13px; color: var(--muted); }
.inline-form input { font: inherit; font-size: 14px; border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; background: var(--surface); color: var(--fg); min-width: 0; }
.inline-form input[type="text"] { flex: 1 1 200px; }
.toast { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); inset-inline-start: 50%; transform: translateX(50%); background: var(--fg); color: var(--bg); padding: 8px 16px; border-radius: 8px; font-size: 14px; }
.notice { margin-top: 16px; background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 10px 14px; font-size: 14px; }
@media (prefers-reduced-motion: no-preference) { .job { transition: border-color .15s; } .job:hover { border-color: var(--accent); } }
</style>

<div class="wrap">
  <div class="top">
    <div class="brand">
      <h1>Job<span>Hunter</span></h1>
      <div class="run" id="run">טוען נתונים…</div>
    </div>
    <div class="controls">
      <div class="tabs" id="tabs" role="tablist"></div>
      <input class="search" id="search" type="search" placeholder="חיפוש לפי תפקיד, חברה, עיר או הערה">
    </div>
  </div>
  <div class="notice" id="notice" hidden></div>
  <div class="list" id="list">
    <div class="empty"><strong>טוען משרות…</strong>המשרות מגיעות מהסוכן הגדול בכל בוקר ב-09:00.</div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const STATUS = {
  new: { label: "חדש", tone: "accent" },
  hold: { label: "בהמתנה", tone: "warn" },
  applied: { label: "הוגש", tone: "ok" },
  interview: { label: "ראיון", tone: "ok" },
  offer: { label: "הצעה", tone: "ok" },
  rejected: { label: "דחייה", tone: "bad" },
  not_interested: { label: "לא מעוניין", tone: "muted" },
  closed: { label: "נסגרה", tone: "muted" },
  filtered: { label: "סוננה", tone: "muted" },
};
const TABS = [
  { id: "new", label: "חדש", statuses: ["new"] },
  { id: "hold", label: "בהמתנה", statuses: ["hold"] },
  { id: "applied", label: "הוגש", statuses: ["applied", "interview", "offer", "rejected"] },
  { id: "not_interested", label: "לא מעוניין", statuses: ["not_interested"] },
  { id: "closed", label: "נסגרה", statuses: ["closed"] },
  { id: "filtered", label: "סוננו ע״י הסוכן", statuses: ["filtered"] },
];
const EMPTY_TEXT = {
  new: "אין משרות חדשות. משרות חדשות יופיעו כאן אחרי הריצה של 09:00.",
  hold: "אין משרות בהמתנה. סמן משרה \"בהמתנה\" כדי לחזור אליה בהמשך.",
  applied: "עוד לא סימנת הגשה. לחיצה על \"הגשתי\" שומרת את התאריך ואת תיאור התפקיד.",
  not_interested: "אין משרות שסימנת \"לא מעוניין\".",
  closed: "אין משרות שנסגרו.",
  filtered: "הסוכן לא סינן משרות. משרות שלא עמדו בדרישות החובה יופיעו כאן עם הנימוק.",
};
const RANK = { high: { label: "התאמה גבוהה", tone: "ok" }, mid: { label: "התאמה בינונית", tone: "accent" }, low: { label: "התאמה נמוכה", tone: "warn" } };
const FIELD_LABELS = { location: "מיקום", work_mode: "אופן עבודה", level: "רמה", scope: "היקף", employment: "סוג העסקה", salary: "שכר", experience: "ניסיון", education: "השכלה", degree_time: "זמן לסיום תואר", degree_year: "שנה בתואר", company: "חברה" };

const state = { jobs: [], tab: "new", query: "", form: null, draft: {}, lastRun: null, db: null, busy: new Set(), openDetails: new Set() };
const el = (id) => document.getElementById(id);

function esc(v) {
  return String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function fmtDate(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return esc(iso);
  return d.toLocaleDateString("he-IL", { day: "2-digit", month: "2-digit", year: "numeric" });
}
function todayISO() { return new Date().toISOString().slice(0, 10); }
function daysUntil(iso) { return Math.ceil((new Date(iso + "T23:59:59") - new Date()) / 86400000); }

// One field value, honouring the card rules: "not stated" in grey, inferred values in their own colour with the agent's note.
function fv(job, key) {
  if ((job.not_stated || []).includes(key)) return `<span class="ns">לא צוין</span>`;
  const raw = job[key];
  const val = Array.isArray(raw) ? raw.join(" / ") : raw;
  if (val === undefined || val === null || val === "") return `<span class="ns">לא צוין</span>`;
  const note = (job.inferred || {})[key];
  if (note) return `<span class="inf" title="${esc(note)}">${esc(val)}</span>`;
  return esc(val);
}

function alertsFor(job) {
  const out = [];
  if (job.deadline) {
    const d = daysUntil(job.deadline);
    if (d >= 0) out.push({ tone: d <= 7 ? "bad" : "warn", text: `⏰ הגשה עד ${fmtDate(job.deadline)} (${d === 0 ? "היום" : "עוד " + d + " ימים"})` });
    else out.push({ tone: "muted", text: `⏰ מועד ההגשה עבר (${fmtDate(job.deadline)})` });
  }
  for (const a of job.alerts || []) out.push({ tone: "warn", text: "⚠️ " + a });
  return out;
}

function actionsFor(job) {
  const s = job.status;
  if (["new", "hold", "filtered"].includes(s)) {
    const list = [{ kind: "apply", label: "הגשתי", primary: true }];
    if (s !== "hold") list.push({ kind: "hold", label: "בהמתנה" });
    list.push({ kind: "not_interested", label: "לא מעוניין" });
    if (s !== "new") list.push({ kind: "new", label: "החזר לחדש" });
    return list;
  }
  if (s === "applied") return [{ kind: "interview", label: "ראיון" }, { kind: "offer", label: "הצעה" }, { kind: "rejected", label: "דחייה" }];
  if (s === "interview") return [{ kind: "offer", label: "הצעה" }, { kind: "rejected", label: "דחייה" }];
  if (s === "not_interested") return [{ kind: "new", label: "החזר לחדש" }];
  return [];
}

function formHTML(job) {
  if (!state.form || state.form.id !== job.id) return "";
  const d = state.draft;
  if (state.form.kind === "apply") {
    return `<form class="inline-form" data-form="apply" data-id="${esc(job.id)}">
      <label for="f-date-${esc(job.id)}">תאריך הגשה</label>
      <input id="f-date-${esc(job.id)}" type="date" name="date" value="${esc(d.date || todayISO())}">
      <input id="f-note-${esc(job.id)}" type="text" name="note" placeholder="איך הגשת? (אתר החברה, מייל, חבר…)" value="${esc(d.note || "")}">
      <button class="btn primary" type="submit">שמור הגשה</button>
      <button class="btn" type="button" data-cancel>ביטול</button>
    </form>`;
  }
  return `<form class="inline-form" data-form="not_interested" data-id="${esc(job.id)}">
    <input id="f-reason-${esc(job.id)}" type="text" name="note" placeholder="למה לא? (נשמר יחד עם שם המשרה)" value="${esc(d.note || "")}">
    <button class="btn primary" type="submit">שמור</button>
    <button class="btn" type="button" data-cancel>ביטול</button>
  </form>`;
}

function cardHTML(job) {
  const st = STATUS[job.status] || STATUS.new;
  const rank = RANK[job.rank];
  const pills = [];
  if (rank && !["filtered", "not_interested", "closed"].includes(job.status)) pills.push(`<span class="pill t-${rank.tone}">${rank.label}</span>`);
  if (state.tab === "applied" || job.status === "hold") pills.push(`<span class="pill t-${st.tone}">${st.label}</span>`);
  const sub = [fv(job, "company"), fv(job, "location"), fv(job, "work_mode")].join(" · ");
  const facts = ["level", "scope", "experience", "degree_time"].map((k) => `<span class="fact"><span class="k">${FIELD_LABELS[k]}:</span> ${fv(job, k)}</span>`).join("");
  const prefs = [...(job.prefs_up || []).map((p) => `<span class="pref up">⬆ ${esc(p)}</span>`), ...(job.prefs_down || []).map((p) => `<span class="pref down">⬇ ${esc(p)}</span>`)].join("");
  const alerts = alertsFor(job).map((a) => `<div class="alert t-${a.tone}">${esc(a.text)}</div>`).join("");
  const rel = job.relevance || {};
  const reasonLabel = job.status === "filtered" ? "למה סוננה" : "למה עברה";
  const reason = rel.reason ? `<p class="reason"><b>${reasonLabel}:</b> ${esc(rel.reason)}</p>` : "";
  const extraReason = job.status === "not_interested" && job.not_interested_reason ? `<p class="reason"><b>למה לא מעוניין:</b> ${esc(job.not_interested_reason)}</p>` : "";
  const applied = job.applied_at ? `<p class="reason"><b>הוגש ב-</b>${fmtDate(job.applied_at)}</p>` : "";
  const li = (arr) => (arr && arr.length ? `<ul>${arr.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>` : `<span class="ns">לא צוין</span>`);
  const inferred = Object.entries(job.inferred || {});
  const hist = (job.history || []).map((h) => `${fmtDate(h.at)} · ${esc((STATUS[h.status] || {}).label || h.status)}${h.note ? " · " + esc(h.note) : ""}`).join("<br>");
  const actions = actionsFor(job).map((a) => `<button class="btn${a.primary ? " primary" : ""}" type="button" data-act="${a.kind}" data-id="${esc(job.id)}" ${state.busy.has(job.id) ? "disabled" : ""}>${a.label}</button>`).join("");
  const applyHref = job.apply_url || job.url;
  const applyBtn = applyHref ? `<a class="btn apply" href="${esc(applyHref)}" target="_blank" rel="noopener">${job.apply_url ? "הגשה ↗" : "לעמוד המשרה ↗"}</a>` : "";
  const link = job.apply_url && job.url && job.url !== job.apply_url ? `<a class="link" href="${esc(job.url)}" target="_blank" rel="noopener">לעמוד המשרה ↗</a>` : "";

  return `<article class="job" data-id="${esc(job.id)}">
    <div class="job-head">
      <div><h3 class="job-title">${esc(job.title)}</h3><div class="job-sub">${sub}</div></div>
      <div class="pills">${pills.join("")}</div>
    </div>
    <div class="facts">${facts}</div>
    ${prefs ? `<div class="prefs">${prefs}</div>` : ""}
    ${alerts ? `<div class="alerts">${alerts}</div>` : ""}
    ${reason}${extraReason}${applied}
    <details data-det="${esc(job.id)}" ${state.openDetails.has(job.id) ? "open" : ""}>
      <summary>פרטים</summary>
      <div class="detail-grid">
        <div class="wide"><h4>תיאור</h4>${job.description ? esc(job.description) : `<span class="ns">לא צוין</span>`}</div>
        <div><h4>דרישות חובה</h4>${li(job.requirements_must)}</div>
        <div><h4>יתרון</h4>${li(job.requirements_adv)}</div>
        <div><h4>השכלה</h4>${fv(job, "education")}</div>
        <div><h4>סוג העסקה · שכר</h4>${fv(job, "employment")} · ${fv(job, "salary")}</div>
        ${job.apply_instructions ? `<div class="wide"><h4>הנחיות הגשה</h4>${esc(job.apply_instructions)}</div>` : ""}
        ${inferred.length ? `<div class="wide"><h4>מה הסוכן הסיק</h4><ul>${inferred.map(([k, v]) => `<li><span class="inf">${esc(FIELD_LABELS[k] || k)}</span> ${esc(v)}</li>`).join("")}</ul></div>` : ""}
        <div class="wide"><h4><label for="apply-${esc(job.id)}">קישור להגשה</label></h4><input class="search" id="apply-${esc(job.id)}" data-apply="${esc(job.id)}" type="url" placeholder="הדבק כאן קישור ישיר להגשה" value="${esc(job.apply_url || "")}"></div>
        <div><h4>מקור</h4>${esc(job.source || "")}${job.posted_at ? " · פורסם " + fmtDate(job.posted_at) : ""}</div>
        <div><h4>היסטוריה</h4><div class="hist">${hist || "—"}</div></div>
      </div>
    </details>
    <textarea class="notes" id="notes-${esc(job.id)}" data-notes="${esc(job.id)}" placeholder="הערות שלך על המשרה">${esc(job.notes || "")}</textarea>
    ${formHTML(job)}
    <div class="actions">${applyBtn}${actions}${link}</div>
  </article>`;
}

function matches(job, q) {
  if (!q) return true;
  const hay = [job.title, job.company, job.location, job.notes, job.not_interested_reason].join(" ").toLowerCase();
  return hay.includes(q.toLowerCase());
}

function render() {
  const counts = Object.fromEntries(TABS.map((t) => [t.id, state.jobs.filter((j) => t.statuses.includes(j.status)).length]));
  el("tabs").innerHTML = TABS.map((t) => `<button class="tab" role="tab" type="button" data-tab="${t.id}" aria-selected="${t.id === state.tab}">${t.label}<span class="n">${counts[t.id]}</span></button>`).join("");

  const tab = TABS.find((t) => t.id === state.tab);
  const rankOrder = { high: 0, mid: 1, low: 2 };
  const shown = state.jobs
    .filter((j) => tab.statuses.includes(j.status) && matches(j, state.query))
    .sort((a, b) => (rankOrder[a.rank] ?? 3) - (rankOrder[b.rank] ?? 3) || String(b.first_seen || "").localeCompare(String(a.first_seen || "")));

  if (!shown.length) {
    const text = state.query ? "אין משרות שמתאימות לחיפוש בלשונית הזו." : EMPTY_TEXT[state.tab];
    el("list").innerHTML = `<div class="empty"><strong>${state.jobs.length ? "הלשונית ריקה" : "אין עדיין משרות"}</strong>${esc(text)}</div>`;
  } else {
    el("list").innerHTML = shown.map(cardHTML).join("");
  }

  const r = state.lastRun;
  el("run").innerHTML = r
    ? `ריצה אחרונה: <b>${fmtDate(r.at)}</b> · ${esc(r.summary || "")}`
    : "עוד לא הייתה ריצה. הריצה הראשונה: 09:00.";
}

function toast(msg) {
  const t = el("toast");
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { t.hidden = true; }, 2200);
}

async function changeStatus(job, status, extra = {}, note = "") {
  if (!state.db || state.busy.has(job.id)) return;
  state.busy.add(job.id);
  render();
  const history = [...(job.history || []), { status, at: new Date().toISOString(), note }];
  try {
    await state.db.collection("jobs").doc(job.id).update({ status, history, ...extra });
    toast(`"${job.title}" סומנה: ${STATUS[status].label}`);
  } catch (e) {
    toast(e && e.code === "invalid_argument" ? "אין הרשאה לשמור שינויים בדף הזה." : "השמירה לא הצליחה. נסה שוב בעוד רגע.");
  } finally {
    state.busy.delete(job.id);
    render();
  }
}

document.addEventListener("click", (e) => {
  const tabBtn = e.target.closest("[data-tab]");
  if (tabBtn) { state.tab = tabBtn.dataset.tab; state.form = null; try { localStorage.setItem("jh-tab", state.tab); } catch {} render(); return; }
  if (e.target.closest("[data-cancel]")) { state.form = null; state.draft = {}; render(); return; }
  const act = e.target.closest("[data-act]");
  if (!act) return;
  const job = state.jobs.find((j) => j.id === act.dataset.id);
  if (!job) return;
  const kind = act.dataset.act;
  if (kind === "apply" || kind === "not_interested") { state.form = { id: job.id, kind }; state.draft = {}; render(); return; }
  changeStatus(job, kind);
});

document.addEventListener("input", (e) => {
  if (e.target.id === "search") { state.query = e.target.value.trim(); render(); el("search").focus(); return; }
  const form = e.target.closest("form[data-form]");
  if (form && e.target.name) state.draft[e.target.name] = e.target.value;
});

document.addEventListener("submit", (e) => {
  e.preventDefault();
  const form = e.target.closest("form[data-form]");
  const job = form && state.jobs.find((j) => j.id === form.dataset.id);
  if (!job) return;
  const data = new FormData(form);
  const note = String(data.get("note") || "").trim();
  state.form = null; state.draft = {};
  if (form.dataset.form === "apply") {
    const date = String(data.get("date") || todayISO());
    changeStatus(job, "applied", { applied_at: date, applied_description: job.description || "", apply_channel: note }, note);
  } else {
    changeStatus(job, "not_interested", { not_interested_reason: note }, note);
  }
});

document.addEventListener("change", async (e) => {
  const applyId = e.target.dataset && e.target.dataset.apply;
  if (applyId && state.db) {
    const job = state.jobs.find((j) => j.id === applyId);
    const value = e.target.value.trim();
    if (!job || value === (job.apply_url || "")) return;
    if (value && !/^https?:\/\//.test(value)) { toast("הקישור צריך להתחיל ב-https://"); return; }
    try { await state.db.collection("jobs").doc(applyId).update({ apply_url: value }); toast("קישור ההגשה נשמר"); }
    catch { toast("הקישור לא נשמר. נסה שוב."); }
    return;
  }
  const id = e.target.dataset && e.target.dataset.notes;
  if (!id || !state.db) return;
  const job = state.jobs.find((j) => j.id === id);
  const value = e.target.value;
  if (!job || value === (job.notes || "")) return;
  try { await state.db.collection("jobs").doc(id).update({ notes: value }); toast("ההערה נשמרה"); }
  catch { toast("ההערה לא נשמרה. נסה שוב."); }
});

document.addEventListener("toggle", (e) => {
  const id = e.target.dataset && e.target.dataset.det;
  if (!id) return;
  if (e.target.open) state.openDetails.add(id); else state.openDetails.delete(id);
}, true);

try { const saved = localStorage.getItem("jh-tab"); if (saved && TABS.some((t) => t.id === saved)) state.tab = saved; } catch {}
render();

(async () => {
  const db = await window.claude?.use?.("db");
  if (!db) {
    el("run").textContent = "";
    el("notice").hidden = false;
    el("notice").textContent = "החיבור לנתוני הדף לא זמין בתצוגה הזו. פתח את הדף ב-claude.ai כשאתה מחובר לחשבון שלך.";
    el("list").innerHTML = "";
    return;
  }
  state.db = db;
  db.collection("jobs").onSnapshot((snap) => {
    state.jobs = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    render();
  }, () => {
    el("notice").hidden = false;
    el("notice").textContent = "טעינת המשרות נעצרה. רענן את הדף.";
  });
  db.collection("runs").orderBy("at", "desc").limit(1).onSnapshot((snap) => {
    state.lastRun = snap.empty ? null : snap.docs[0].data();
    render();
  }, () => {});
})();
</script>
